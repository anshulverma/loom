[project]
name = "loom-torch"
version = "0.1.0"
description = "Offline PyTorch model loops: train, evaluate, predict, batch inference."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anshul Verma", email = "anshul.verma86@gmail.com" }]
keywords = ["pytorch", "training", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14",
    "torchdata>=0.11",
]

[project.urls]
Repository = "https://github.com/anshulverma/loom"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
filterwarnings = ["ignore:Failed to initialize NumPy:UserWarning"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.uv.build-backend]
module-name = "loom"
